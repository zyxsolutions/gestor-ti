name: Build e Release (Windows .exe)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Necessário para criar tag + release com o GITHUB_TOKEN padrão.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar pacotes
        run: dotnet restore src/GestorTI/GestorTI.csproj -r win-x64

      # Um único .exe, autocontido (não exige instalar o .NET), com ReadyToRun (abertura mais rápida)
      # e compressão. IncludeNativeLibrariesForSelfExtract embute as DLLs nativas (SQLite, Skia).
      - name: Publicar (single file + ReadyToRun)
        run: >
          dotnet publish src/GestorTI/GestorTI.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=1.0.${{ github.run_number }}
          -o publish

      - name: Guardar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: GestorTI-win-x64
          path: publish/GestorTI.exe
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gestor TI v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: publish/GestorTI.exe
