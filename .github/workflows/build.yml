name: Build e Release (instalador + atualização automática)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Necessário para criar tag + release com o GITHUB_TOKEN padrão.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  VPK_VERSION: 1.2.161   # deve ser igual à versão do pacote Velopack no .csproj
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # O restore precisa saber que vamos usar ReadyToRun (baixa o runtime pack correto).
      - name: Restaurar pacotes
        run: dotnet restore src/GestorTI/GestorTI.csproj -r win-x64 -p:PublishReadyToRun=true

      # Pasta com o app autocontido (não exige instalar o .NET) e ReadyToRun (abertura mais rápida).
      # Não usamos single-file aqui: o Velopack empacota a pasta e gera atualizações "delta" (só o que mudou).
      - name: Publicar
        run: >
          dotnet publish src/GestorTI/GestorTI.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:Version=${{ env.APP_VERSION }}
          -o publish

      - name: Instalar vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # Baixa as versões anteriores para gerar os deltas. Na primeira execução não há nada a baixar.
      - name: Baixar releases anteriores
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar (Setup.exe + pacotes de atualização)
        run: >
          vpk pack
          --packId GestorTI
          --packTitle "ZYX Core"
          --icon src/GestorTI/Assets/app.ico
          --packVersion ${{ env.APP_VERSION }}
          --packDir publish
          --mainExe GestorTI.exe

      - name: Publicar no GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "ZYX Core v${{ env.APP_VERSION }}"
          --tag v${{ env.APP_VERSION }}
          --token ${{ secrets.GITHUB_TOKEN }}
